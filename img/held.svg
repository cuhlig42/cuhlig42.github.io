<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="t">
  <title id="t">Synthwave-Sonnenuntergang über einem Neon-Gitter</title>
  <style>
    .stern { animation: funkeln 3.2s ease-in-out infinite; }
    .stern:nth-of-type(2n) { animation-delay: -1.1s; }
    .stern:nth-of-type(3n) { animation-delay: -2.3s; }
    .punkt { animation: puls 1.6s ease-in-out infinite; }
    .boden { animation: fahren 2.4s linear infinite; }
    @keyframes funkeln { 50% { opacity: 0.25; } }
    @keyframes puls { 50% { opacity: 0.3; } }
    @keyframes fahren { from { transform: translateY(0); } to { transform: translateY(40px); } }
    @media (prefers-reduced-motion: reduce) {
      .stern, .punkt, .boden { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c2a"/>
      <stop offset="0.55" stop-color="#3a1d6e"/>
      <stop offset="0.63" stop-color="#7a2a8c"/>
    </linearGradient>
    <linearGradient id="sonne" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="0.5" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#ff3f9a"/>
    </linearGradient>
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0f4f"/>
      <stop offset="1" stop-color="#0e0820"/>
    </linearGradient>
    <radialGradient id="schein" cx="0.5" cy="0.56" r="0.5">
      <stop offset="0" stop-color="#ff5fb0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5fb0" stop-opacity="0"/>
    </radialGradient>
    <mask id="streifen">
      <rect width="480" height="480" fill="#fff"/>
      <rect x="0" y="226" width="480" height="4" fill="#000"/>
      <rect x="0" y="244" width="480" height="6" fill="#000"/>
      <rect x="0" y="262" width="480" height="8" fill="#000"/>
      <rect x="0" y="280" width="480" height="11" fill="#000"/>
    </mask>
    <clipPath id="rahmen"><rect width="480" height="480" rx="36"/></clipPath>
    <clipPath id="unten"><rect x="0" y="300" width="480" height="180"/></clipPath>
  </defs>

  <g clip-path="url(#rahmen)">
    <rect width="480" height="480" fill="url(#himmel)"/>
    <rect width="480" height="480" fill="url(#schein)"/>

    <g fill="#fff">
      <circle class="stern" cx="62" cy="88" r="1.8"/>
      <circle class="stern" cx="128" cy="46" r="1.2"/>
      <circle class="stern" cx="190" cy="104" r="1.5"/>
      <circle class="stern" cx="318" cy="58" r="2"/>
      <circle class="stern" cx="388" cy="118" r="1.3"/>
      <circle class="stern" cx="430" cy="64" r="1.6"/>
      <circle class="stern" cx="96" cy="170" r="1.1"/>
      <circle class="stern" cx="408" cy="190" r="1.2"/>
      <circle class="stern" cx="262" cy="30" r="1.1"/>
    </g>

    <circle cx="240" cy="250" r="118" fill="url(#sonne)" mask="url(#streifen)"/>

    <path d="M0 300 L0 262 L44 238 L82 258 L126 214 L170 262 L196 250 L222 300 Z" fill="#1c0b3a"/>
    <path d="M480 300 L480 254 L440 230 L398 262 L352 222 L306 270 L282 258 L258 300 Z" fill="#1c0b3a"/>

    <rect x="0" y="300" width="480" height="180" fill="url(#grund)"/>
    <g clip-path="url(#unten)" stroke="#ff4fd0" stroke-width="1.6" fill="none" opacity="0.85">
      <g class="boden">
        <line x1="0" y1="300" x2="480" y2="300"/>
        <line x1="0" y1="304" x2="480" y2="304"/>
        <line x1="0" y1="312" x2="480" y2="312"/>
        <line x1="0" y1="324" x2="480" y2="324"/>
        <line x1="0" y1="342" x2="480" y2="342"/>
        <line x1="0" y1="366" x2="480" y2="366"/>
        <line x1="0" y1="398" x2="480" y2="398"/>
        <line x1="0" y1="438" x2="480" y2="438"/>
        <line x1="0" y1="478" x2="480" y2="478"/>
      </g>
      <line x1="240" y1="300" x2="240" y2="480"/>
      <line x1="240" y1="300" x2="160" y2="480"/>
      <line x1="240" y1="300" x2="320" y2="480"/>
      <line x1="240" y1="300" x2="80" y2="480"/>
      <line x1="240" y1="300" x2="400" y2="480"/>
      <line x1="240" y1="300" x2="0" y2="480"/>
      <line x1="240" y1="300" x2="480" y2="480"/>
      <line x1="240" y1="300" x2="-120" y2="480"/>
      <line x1="240" y1="300" x2="600" y2="480"/>
      <line x1="240" y1="300" x2="-280" y2="480"/>
      <line x1="240" y1="300" x2="760" y2="480"/>
    </g>
    <rect x="0" y="298" width="480" height="3" fill="#ffd36b" opacity="0.9"/>

    <g transform="translate(28 28)">
      <rect width="62" height="32" rx="16" fill="#0e0820" fill-opacity="0.6" stroke="#ff4f8b" stroke-width="1.5"/>
      <circle class="punkt" cx="20" cy="16" r="5" fill="#ff4f8b"/>
      <path d="M35 9 L47 16 L35 23 Z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
